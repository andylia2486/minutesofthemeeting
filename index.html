<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minutes of the Meeting | Purok 2 Youth Council</title>
<style>
:root{--bg:#f2f6fc;--surface:#fff;--ink:#001a4d;--muted:#4a5a7d;--line:#cfd9ea;--accent:#005aff;--sun:#00a3e0;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#00112e;--surface:#04204f;--ink:#eef4ff;--muted:#9fb3d9;--line:#12346e;--accent:#38b6ff;--sun:#00a3e0;--on-accent:#00112e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#00112e;--surface:#04204f;--ink:#eef4ff;--muted:#9fb3d9;--line:#12346e;--accent:#38b6ff;--sun:#00a3e0;--on-accent:#00112e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(14px,4vw,32px)}
img{max-width:100%}
body{overflow-wrap:anywhere}
header.hero{background:linear-gradient(115deg,#001a4d 0 62%,#005aff 62% 74%,#00a3e0 74% 80%,#001a4d 80%);color:#fff;padding:52px 0 44px;border-bottom:6px solid #fff}
:root:not([data-theme="light"]) header.hero{}
.hero .wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.logo{width:clamp(88px,22vw,140px);height:auto;aspect-ratio:1;border-radius:50%;flex:none;object-fit:contain}
.hero h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;letter-spacing:-.02em;font-weight:800;font-style:italic}
.hero p{margin:8px 0 0;color:#c9d0e3;max-width:46ch}
h2{font-size:1.5rem;margin:0 0 16px;letter-spacing:-.01em;font-weight:800;font-style:italic;padding-left:14px;border-left:6px solid var(--accent)}
section{padding:44px 0 0}
.letter{background:var(--surface);border-left:6px solid var(--accent);padding:24px 26px;border-radius:4px}
.letter p{margin:0 0 12px;max-width:68ch}
.sig{font-weight:600;margin-top:16px!important}
.sig span{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
ol{padding-left:1.2em;margin:0;max-width:62ch}
ol li{margin-bottom:6px}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin-top:8px}
.nav a,.nav div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;color:inherit;text-decoration:none;display:block}
.nav strong{display:block;font-size:1.05rem}
.nav small{display:block;color:var(--muted);margin-top:2px}
.nav a{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.nav a:hover,.nav a:focus-visible{background:var(--accent);color:var(--on-accent)}
.nav a:hover small,.nav a:focus-visible small{color:inherit}
a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.unit{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:18px 20px}
.unit h3{margin:0 0 10px;font-size:1rem;font-weight:800;font-style:italic}
.unit ul{list-style:none;margin:0;padding:0}
.unit li{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}
.unit li:first-child{border-top:0}
.unit .role{font-size:.85rem;color:var(--muted)}
.unit .vacant{color:var(--muted);font-style:italic}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
footer{margin-top:48px;padding:24px 0 32px;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:.95rem}
@media (max-width:600px){
 header.hero{padding:32px 0 28px;background:linear-gradient(115deg,#001a4d 0 70%,#005aff 70% 82%,#00a3e0 82% 88%,#001a4d 88%)}
 .hero .wrap{flex-direction:column;align-items:center;text-align:center;gap:16px}
 .hero p{margin-left:auto;margin-right:auto}
 section{padding-top:32px}
 .letter{padding:18px 16px}
 h2{font-size:1.25rem}
 .tabs span{font-size:.85rem;padding:5px 12px}
}
@media (min-width:1000px){.letter{padding:30px 34px}.unit{padding:22px 24px}}

.back{display:inline-block;color:#cfe6ff;text-decoration:none;font-size:.9rem;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.4)}
.back:hover{color:#fff}
.hero .wrap>div{min-width:0}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.tools .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{flex:1 1 240px;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tools input:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chip{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.count{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:1.05rem;line-height:1.25}
.card .pos{color:var(--accent);font-weight:700;font-size:.9rem;font-style:italic}
.badge{align-self:flex-start;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;margin-top:4px}
.badge.available{background:#d7f5e3;color:#0b5a2c}
.badge.busy{background:#ffe1d6;color:#8a2a0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.available{background:#0e4a2c;color:#b9f3d0}:root:not([data-theme="light"]) .badge.busy{background:#5a2312;color:#ffd2c2}}
.card a{color:var(--accent);text-decoration:none}
.card a:hover{text-decoration:underline}
.line{font-size:.92rem;margin-top:2px}
.line.dim{color:var(--muted)}
.empty{padding:28px 0;color:var(--muted)}
h2 small{font-size:.8rem;font-weight:400;font-style:normal;color:var(--muted);margin-left:8px}

.meet{display:flex;flex-direction:column;gap:10px}
.meet .date{font-size:1.15rem;font-weight:800;font-style:italic;line-height:1.2}
.meet .dow{color:var(--muted);font-size:.9rem;font-weight:400;font-style:normal}
.meet .div{align-self:flex-start;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.meet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.93rem}
.meet dt{color:var(--muted)}
.meet dd{margin:0}
.file{margin-top:4px;padding-top:10px;border-top:1px solid var(--line);font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.file b{font-weight:600}
.file a.open{border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-weight:600}
.file a.open:hover{background:var(--accent);color:var(--on-accent);text-decoration:none}
.file button.open{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:3px 12px}
.file button.open:hover,.file button.open:focus-visible{background:var(--accent);color:var(--on-accent)}
.file button.dl{background:var(--accent);color:var(--on-accent)}
</style>
</head>

function key(r){return r.y*10000+r.m*100+r.d}
function card(r){
  var f = r.p ? '<button class="open" data-a="open" data-k="'+r.p+'" data-n="'+r.y+'-'+('0'+r.m).slice(-2)+'-'+('0'+r.d).slice(-2)+'">Open file</button><button class="open dl" data-a="dl" data-k="'+r.p+'" data-n="'+r.y+'-'+('0'+r.m).slice(-2)+'-'+('0'+r.d).slice(-2)+'">Download</button>' : (r.u ? '<a class="open" href="'+esc(r.u)+'" target="_blank" rel="noopener">Open file</a>' : '');
  return '<article class="card meet"><span class="div">'+esc(r.div)+'</span>'
   +'<div class="date">'+label(r)+' <span class="dow">'+dow(r)+'</span></div>'
   +'<dl><dt>Presiding officer</dt><dd>'+esc(r.po)+'</dd><dt>Minutes by</dt><dd>'+esc(r.mb)+'</dd></dl>'
   +'<div class="file"><span>File:</span> <b>'+esc(r.f)+'</b> '+f+'</div></article>';
}
function render(){
  var q=query.trim().toLowerCase();
  var list=ROWS.filter(function(r){return !q||(label(r)+" "+dow(r)+" "+r.div+" "+r.po+" "+r.mb+" "+r.f).toLowerCase().indexOf(q)>-1});
  list.sort(function(a,b){return sort==="new"?key(b)-key(a):key(a)-key(b)});
  document.getElementById("list").innerHTML = list.length?list.map(card).join(""):'<p class="empty">No meetings match your search.</p>';
  document.getElementById("count").textContent = list.length+" of "+ROWS.length+" meetings shown";
}
document.getElementById("q").addEventListener("input",function(e){query=e.target.value;render()});
document.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){
  sort=b.getAttribute("data-s");
  document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===b?"true":"false")});
  render();
})});
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]"); if(!b)return;
  try{
    var u=pdfUrl(b.getAttribute("data-k"));
    if(b.getAttribute("data-a")==="dl"){var a=document.createElement("a");a.href=u;a.download="Minutes_of_the_Meeting_"+b.getAttribute("data-n")+".pdf";document.body.appendChild(a);a.click();a.remove()}
    else{window.open(u,"_blank")}
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }catch(err){console.error(err)}
});
render();
</script>
</body>
</html>
